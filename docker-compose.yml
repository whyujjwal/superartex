services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superartex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-superartex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superartex} -d ${POSTGRES_DB:-superartex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  superartex:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        SUPERARTEX_VERSION: ${SUPERARTEX_VERSION:-dev}
    image: superartex:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERARTEX_PG_DSN: postgres://${POSTGRES_USER:-superartex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-superartex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPERARTEX_LLM_PROVIDER: ${SUPERARTEX_LLM_PROVIDER:-}
      SUPERARTEX_LLM_MODEL: ${SUPERARTEX_LLM_MODEL:-}
      SUPERARTEX_LLM_BASE_URL: ${SUPERARTEX_LLM_BASE_URL:-}
      SUPERARTEX_LLM_PROXY: ${SUPERARTEX_LLM_PROXY:-}
      SUPERARTEX_JWT_KEY_DIR: /app/keys
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      SUPERARTEX_SECRET_KEY: ${SUPERARTEX_SECRET_KEY:-}
      SUPERARTEX_TRUSTED_PROXIES: ${SUPERARTEX_TRUSTED_PROXIES:-}
      # Untrusted-output boundary: on by default (empty = on); SUPERARTEX_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      SUPERARTEX_UNTRUSTED_BOUNDARY: ${SUPERARTEX_UNTRUSTED_BOUNDARY:-}
      SUPERARTEX_UPDATE_CHECK: ${SUPERARTEX_UPDATE_CHECK:-}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      SUPERARTEX_NOISE_PROFILE: ${SUPERARTEX_NOISE_PROFILE:-}
      SUPERARTEX_TARGET_USER_AGENT: ${SUPERARTEX_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      SUPERARTEX_TASK_BUDGET_TOKENS: ${SUPERARTEX_TASK_BUDGET_TOKENS:-}
      SUPERARTEX_TASK_BUDGET_TURNS: ${SUPERARTEX_TASK_BUDGET_TURNS:-}
      SUPERARTEX_INTENT_BUDGET_TOKENS: ${SUPERARTEX_INTENT_BUDGET_TOKENS:-}
      SUPERARTEX_INTENT_BUDGET_TURNS: ${SUPERARTEX_INTENT_BUDGET_TURNS:-}
    ports:
      - "${SUPERARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
