<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" fill="none" role="img" aria-labelledby="toolkit-title toolkit-desc">
  <title id="toolkit-title">SuperArtex toolkit constellation</title>
  <desc id="toolkit-desc">An isometric SuperArtex terminal sits on a layered workbench, surrounded by four linked tool panels. Recon includes nmap and subfinder; web discovery includes httpx, katana, and ffuf; validation includes nuclei and dalfox; lab and browser includes sqlmap and Playwright. These tools are bundled in the Docker image.</desc>
  <defs>
    <linearGradient id="tk-background" x1="0" y1="0" x2="1120" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#080A12"/><stop offset="1" stop-color="#141023"/></linearGradient>
    <radialGradient id="tk-halo" cx="0" cy="0" r="1" gradientTransform="translate(558 352) scale(390 258)" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6" stop-opacity=".17"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="tk-surface" x1="419" y1="371" x2="650" y2="482" gradientUnits="userSpaceOnUse"><stop stop-color="#352345"/><stop offset="1" stop-color="#1D172C"/></linearGradient>
    <linearGradient id="tk-monitor" x1="430" y1="231" x2="661" y2="394" gradientUnits="userSpaceOnUse"><stop stop-color="#30223F"/><stop offset="1" stop-color="#181322"/></linearGradient>
    <linearGradient id="tk-screen" x1="448" y1="250" x2="636" y2="362" gradientUnits="userSpaceOnUse"><stop stop-color="#151424"/><stop offset="1" stop-color="#0A111B"/></linearGradient>
    <linearGradient id="tk-orbit" x1="269" y1="221" x2="875" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#B79AFF" stop-opacity=".7"/><stop offset=".5" stop-color="#91DBE9" stop-opacity=".25"/><stop offset="1" stop-color="#B79AFF" stop-opacity=".7"/></linearGradient>
    <pattern id="tk-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#C4B5FD" fill-opacity=".07"/></pattern>
    <filter id="tk-soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="tk-shadow" x="-20%" y="-25%" width="140%" height="165%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#03040A" flood-opacity=".6"/></filter>
  </defs>

  <rect width="1120" height="600" rx="24" fill="url(#tk-background)"/>
  <rect width="1120" height="600" rx="24" fill="url(#tk-dots)"/>
  <rect width="1120" height="600" rx="24" fill="url(#tk-halo)"/>
  <rect x=".5" y=".5" width="1119" height="599" rx="23.5" stroke="#A78BFA" stroke-opacity=".18"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="61" fill="#F7F5FF" font-size="38" font-weight="700" letter-spacing="-1">The tools, within reach.</text>
    <text x="50" y="94" fill="#B7B3C9" font-size="21">Bundled in the Docker image</text>

    <g aria-hidden="true">
      <path d="M929 55h24l11 11h44m-55-11 11-11h44m-5 22h22" stroke="#B79AFF" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
      <circle cx="929" cy="55" r="4" fill="#B79AFF"/><circle cx="1010" cy="44" r="3" fill="#91DBE9"/><circle cx="1028" cy="66" r="3" fill="#A5DFCB"/>

      <ellipse cx="560" cy="351" rx="383" ry="151" transform="rotate(-13 560 351)" stroke="#B79AFF" stroke-opacity=".1" stroke-width="12" filter="url(#tk-soft-glow)"/>
      <ellipse cx="560" cy="351" rx="383" ry="151" transform="rotate(-13 560 351)" stroke="url(#tk-orbit)" stroke-width="1.5"/>
      <ellipse cx="560" cy="351" rx="277" ry="205" transform="rotate(28 560 351)" stroke="#B79AFF" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="3 9"/>
      <path d="M297 248C358 222 389 217 432 235M678 259C729 232 744 220 787 213M327 459C369 465 394 448 426 426M700 426C736 440 753 450 788 467" stroke="#B79AFF" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
      <path d="M297 248C358 222 389 217 432 235M678 259C729 232 744 220 787 213M327 459C369 465 394 448 426 426M700 426C736 440 753 450 788 467" stroke="#B79AFF" stroke-opacity=".15" stroke-width="7" filter="url(#tk-soft-glow)"/>

      <circle cx="375" cy="193" r="5" fill="#B79AFF"/><circle cx="375" cy="193" r="12" stroke="#B79AFF" stroke-opacity=".2"/>
      <circle cx="738" cy="332" r="5" fill="#91DBE9"/><circle cx="738" cy="332" r="12" stroke="#91DBE9" stroke-opacity=".2"/>
      <circle cx="437" cy="535" r="4" fill="#A5DFCB"/><circle cx="437" cy="535" r="11" stroke="#A5DFCB" stroke-opacity=".2"/>
      <circle cx="664" cy="155" r="3" fill="#B79AFF"/>
      <circle cx="887" cy="346" r="3" fill="#A5DFCB"/>
      <circle cx="195" cy="339" r="3" fill="#91DBE9"/>
      <path d="M451 155v12m-6-6h12M988 351v12m-6-6h12M370 344v10m-5-5h10M637 552v10m-5-5h10" stroke="#B79AFF" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Layered isometric workbench and terminal. -->
