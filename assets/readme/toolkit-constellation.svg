      <ellipse cx="560" cy="494" rx="178" ry="34" fill="#05060D" fill-opacity=".55"/>
      <path d="m397 445 164-82 164 82v22l-164 82-164-82Z" fill="#141020" stroke="#544064"/>
      <path d="m397 445 164 82 164-82M561 527v22" stroke="#77608F" stroke-opacity=".5"/>
      <path d="m407 422 154-77 154 77v19l-154 77-154-77Z" fill="#241A33" stroke="#8D6EB1" stroke-opacity=".7"/>
      <path d="m407 422 154-77 154 77-154 77Z" fill="url(#tk-surface)" stroke="#B79AFF" stroke-opacity=".65"/>
      <path d="m407 422 154 77 154-77M561 499v19" stroke="#B79AFF" stroke-opacity=".4"/>
      <path d="m428 424 35-17m193 36 33-16m-132 56 13-7" stroke="#91DBE9" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
      <path d="m487 379 94 8 24 34-99-9Z" fill="#20172D" stroke="#9A7ABC"/>
      <path d="m506 412 99 9 11 5-99-8Z" fill="#3B2A4D" stroke="#9A7ABC" stroke-opacity=".7"/>
      <path d="m432 227 19-10 219 18-19 10Z" fill="#49315C" stroke="#A88BCC"/>
      <path d="m651 245 19-10v147l-19 12Z" fill="#21182E" stroke="#9A7ABC"/>
      <path d="m432 227 219 18v149l-219-18Z" fill="url(#tk-monitor)" stroke="#B79AFF" stroke-width="1.5"/>
      <path d="m447 249 189 15v98l-189-15Z" fill="url(#tk-screen)" stroke="#6C5488"/>
      <path d="m455 257 172 14" stroke="#B79AFF" stroke-opacity=".12"/>
      <path d="m528 375 29 2" stroke="#B79AFF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="625" cy="380" r="2.5" fill="#A5DFCB"/>
      <path d="m487 432 61-29 72 35-61 29Z" fill="#0D0D18" stroke="#75608E"/>
      <path d="m500 432 49-23 57 28-48 23Zm12 6 48-23m-35 29 47-24m-35 30 47-24m-62-24 56 28m-68-22 57 28" stroke="#85699F" stroke-opacity=".6"/>
      <path d="m647 385 25 12-24 12-25-12Z" fill="#3C2C4E" stroke="#9A7ABC"/>
      <path d="m640 397 8-4 8 4-8 4Z" fill="#91DBE9" fill-opacity=".75"/>
    </g>
    <g transform="matrix(1 .08 0 1 0 -36)">
      <text x="466" y="325" fill="#F7F5FF" font-size="27" font-weight="650" letter-spacing="-.7">SuperArtex</text>
      <path d="m467 344 9 7-9 7m18 0h15" stroke="#A5DFCB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M516 350h64" stroke="#B79AFF" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
      <path d="M516 361h38" stroke="#B79AFF" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Tool satellites use the same terminal language as the central bench. -->
    <g transform="rotate(-3 195 218)" filter="url(#tk-shadow)">
      <rect x="48" y="150" width="294" height="132" rx="17" fill="#151321" stroke="#B79AFF" stroke-opacity=".65"/>
      <path d="M48 178h294" stroke="#B79AFF" stroke-opacity=".18"/>
      <g fill="#B79AFF"><circle cx="65" cy="164" r="3"/><circle cx="77" cy="164" r="3" fill-opacity=".5"/><circle cx="89" cy="164" r="3" fill-opacity=".25"/></g>
      <text x="69" y="214" fill="#EEE7FF" font-size="27" font-weight="650">Recon</text>
      <text x="69" y="254" fill="#B9ADCF" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" letter-spacing="-1.2">nmap · subfinder</text>
      <circle cx="305" cy="208" r="16" stroke="#B79AFF" stroke-opacity=".5"/>
      <circle cx="305" cy="208" r="8" stroke="#B79AFF" stroke-opacity=".35"/>
      <path d="m305 208 11-11m-11-6v5m-17 12h5m12 12v5m12-17h5" stroke="#B79AFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <g transform="rotate(3 925 214)" filter="url(#tk-shadow)">
      <rect x="778" y="141" width="294" height="146" rx="17" fill="#121822" stroke="#91DBE9" stroke-opacity=".55"/>
      <path d="M778 169h294" stroke="#91DBE9" stroke-opacity=".16"/>
      <g fill="#91DBE9"><circle cx="795" cy="155" r="3"/><circle cx="807" cy="155" r="3" fill-opacity=".5"/><circle cx="819" cy="155" r="3" fill-opacity=".25"/></g>
      <text x="799" y="207" fill="#E0F3F7" font-size="27" font-weight="650" letter-spacing="-.5">Web discovery</text>
      <text x="799" y="248" fill="#A9C4CE" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" letter-spacing="-.8">httpx · katana</text>
      <text x="799" y="276" fill="#A9C4CE" font-family="'SFMono-Regular', Consolas, monospace" font-size="24">ffuf</text>
      <path d="m1036 246 7-6 7 6m-7-6v19m-7 0h14" stroke="#91DBE9" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(2 211 469)" filter="url(#tk-shadow)">
      <rect x="65" y="404" width="292" height="132" rx="17" fill="#121B21" stroke="#A5DFCB" stroke-opacity=".55"/>
      <path d="M65 432h292" stroke="#A5DFCB" stroke-opacity=".16"/>
      <g fill="#A5DFCB"><circle cx="82" cy="418" r="3"/><circle cx="94" cy="418" r="3" fill-opacity=".5"/><circle cx="106" cy="418" r="3" fill-opacity=".25"/></g>
      <text x="86" y="469" fill="#E6F5EF" font-size="27" font-weight="650">Validation</text>
      <text x="86" y="509" fill="#ABCABE" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" letter-spacing="-1">nuclei · dalfox</text>
      <path d="m319 448 12 5v10c0 8-5 13-12 17-7-4-12-9-12-17v-10Z" stroke="#A5DFCB" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="m313 464 4 4 8-9" stroke="#A5DFCB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="rotate(-3 926 475)" filter="url(#tk-shadow)">
      <rect x="779" y="407" width="294" height="146" rx="17" fill="#1B1528" stroke="#B79AFF" stroke-opacity=".6"/>
      <path d="M779 435h294" stroke="#B79AFF" stroke-opacity=".18"/>
      <g fill="#B79AFF"><circle cx="796" cy="421" r="3"/><circle cx="808" cy="421" r="3" fill-opacity=".5"/><circle cx="820" cy="421" r="3" fill-opacity=".25"/></g>
      <text x="800" y="472" fill="#EEE7FF" font-size="27" font-weight="650" letter-spacing="-.5">Lab + browser</text>
      <text x="800" y="510" fill="#B9ADCF" font-family="'SFMono-Regular', Consolas, monospace" font-size="24">sqlmap</text>
      <text x="800" y="539" fill="#B9ADCF" font-family="'SFMono-Regular', Consolas, monospace" font-size="24">Playwright</text>
      <rect x="1023" y="498" width="28" height="27" rx="4" stroke="#B79AFF" stroke-opacity=".6" stroke-width="1.5"/>
      <path d="M1023 506h28m-20 8 5 4-5 4m10 0h5" stroke="#B79AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
