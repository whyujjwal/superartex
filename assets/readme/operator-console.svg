<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" fill="none" role="img" aria-labelledby="operator-title operator-desc">
  <title id="operator-title">A seat for the operator.</title>
  <desc id="operator-desc">Conceptual illustration of a dimensional task console with Sessions, Tool calls, an exploration graph, Pause and Resume controls, a captured Traffic window, and a pending worker or chat approval. Review pending requests when rules ask. Approval coverage varies by agent role; planner and main-agent guards are narrower than worker and chat guards.</desc>
  <defs>
    <linearGradient id="op-bg" x1="0" y1="0" x2="1120" y2="580" gradientUnits="userSpaceOnUse"><stop stop-color="#080A12"/><stop offset="1" stop-color="#161025"/></linearGradient>
    <radialGradient id="op-aura" cx="0" cy="0" r="1" gradientTransform="translate(627 332) rotate(90) scale(269 496)" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6" stop-opacity=".21"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="op-frame" x1="239" y1="139" x2="912" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#70578D"/><stop offset=".42" stop-color="#34283F"/><stop offset="1" stop-color="#B79AFF"/></linearGradient>
    <linearGradient id="op-glass" x1="231" y1="150" x2="943" y2="436" gradientUnits="userSpaceOnUse"><stop stop-color="#1D172D"/><stop offset="1" stop-color="#0D0E18"/></linearGradient>
    <linearGradient id="op-base" x1="271" y1="434" x2="593" y2="507" gradientUnits="userSpaceOnUse"><stop stop-color="#30223F"/><stop offset=".46" stop-color="#483358"/><stop offset="1" stop-color="#171323"/></linearGradient>
    <linearGradient id="op-card" x1="741" y1="300" x2="1014" y2="491" gradientUnits="userSpaceOnUse"><stop stop-color="#2A2038"/><stop offset="1" stop-color="#17121F"/></linearGradient>
    <linearGradient id="op-lilac" x1="521" y1="388" x2="665" y2="426" gradientUnits="userSpaceOnUse"><stop stop-color="#BDA5FF"/><stop offset="1" stop-color="#9873EE"/></linearGradient>
    <pattern id="op-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#C4B5FD" stroke-opacity=".04"/></pattern>
    <filter id="op-shadow" x="-25%" y="-30%" width="150%" height="170%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#03040A" flood-opacity=".65"/></filter>
    <filter id="op-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1120" height="580" rx="24" fill="url(#op-bg)"/>
  <rect width="1120" height="580" rx="24" fill="url(#op-grid)"/>
  <rect width="1120" height="580" rx="24" fill="url(#op-aura)"/>
  <rect x=".5" y=".5" width="1119" height="579" rx="23.5" stroke="#A78BFA" stroke-opacity=".18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="61" fill="#F7F5FF" font-size="32" font-weight="700" letter-spacing="-.8">A seat for the operator.</text>
    <text x="49" y="98" fill="#B7B3C9" font-size="22">Follow the run. Steer the next step.</text>
    <text x="1070" y="58" text-anchor="end" fill="#9A8BAC" font-size="14" letter-spacing="1.6">CONCEPTUAL ILLUSTRATION</text>

    <ellipse cx="591" cy="474" rx="374" ry="31" fill="#04050B" fill-opacity=".65"/>
    <path d="m177 278-51-31 32-59m821 6 55 35-19 49" stroke="#69517F" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="157" cy="188" r="5" fill="#B79AFF"/>
    <circle cx="1015" cy="279" r="5" fill="#8CE3C0"/>
    <path d="m100 158 4 7 8 1-6 6 1 8-7-4-7 4 1-8-6-6 8-1Z" fill="#B79AFF" fill-opacity=".45"/>
    <path d="M1020 357h18m-9-9v18" stroke="#B79AFF" stroke-opacity=".45" stroke-width="2"/>

    <g transform="rotate(-3 579 314)">
      <path d="m214 430 731 0 71 45-740 0Z" fill="url(#op-base)" stroke="#74578C" stroke-width="1.5"/>
      <path d="M276 475h740v10l-740 1-62-44v-12Z" fill="#14111D"/>
      <path d="m276 475 740 0" stroke="#C4A3F5" stroke-opacity=".46"/>
      <path d="m420 447 352 0 20 13H438Z" fill="#100E19" stroke="#6A4E7C"/>
      <g stroke="#9273AB" stroke-opacity=".4"><path d="m304 446 63 0m-44 7h63m450-6h59m-40 7h59"/></g>
      <rect x="212" y="140" width="734" height="299" rx="20" fill="url(#op-frame)" filter="url(#op-shadow)"/>
