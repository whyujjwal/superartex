      <path d="M220 197h718" stroke="#574363"/>
      <circle cx="244" cy="172" r="4" fill="#B79AFF"/><circle cx="260" cy="172" r="4" fill="#8B709F"/><circle cx="276" cy="172" r="4" fill="#574562"/>
      <text x="306" y="180" fill="#F0E9FC" font-size="22" font-weight="600">Sessions</text>
      <rect x="772" y="158" width="143" height="29" rx="14.5" fill="#1A2D2A" stroke="#6BB698" stroke-opacity=".55"/>
      <circle cx="790" cy="172" r="4" fill="#8CE3C0"/><text x="807" y="179" fill="#A5EACD" font-size="18">Task view</text>

      <rect x="238" y="215" width="282" height="156" rx="11" fill="#110F1C" stroke="#45364F"/>
      <text x="258" y="247" fill="#DED5F0" font-size="22" font-weight="600">Tool calls</text>
      <path d="M258 263h242" stroke="#3B2F46"/>
      <circle cx="264" cy="286" r="4" fill="#8CE3C0"/><text x="281" y="293" fill="#B5A7C9" font-size="20">Read</text>
      <path d="M386 283h93m-93 7h67" stroke="#534161" stroke-width="3" stroke-linecap="round"/>
      <circle cx="264" cy="321" r="4" fill="#B79AFF"/><text x="281" y="328" fill="#D7CAEB" font-size="20">WebFetch</text>
      <path d="M414 318h65m-65 7h48" stroke="#534161" stroke-width="3" stroke-linecap="round"/>
      <path d="M258 351h118m12 0h63" stroke="#392C45" stroke-width="3" stroke-linecap="round"/>

      <rect x="536" y="215" width="379" height="156" rx="11" fill="#13101E" stroke="#45364F"/>
      <path d="M557 339h337m-337-29h337m-337-29h337m-337-29h337" stroke="#A78BFA" stroke-opacity=".07"/>
      <path d="m567 310 63-43 70 56 82-66 97 42m-249-32 44-28 108 18m-82 66 78 21 101-45" stroke="#B79AFF" stroke-opacity=".4" stroke-width="2"/>
      <g fill="#302240" stroke="#B79AFF" stroke-width="2"><circle cx="567" cy="310" r="8"/><circle cx="630" cy="267" r="11"/><circle cx="700" cy="323" r="8"/><circle cx="782" cy="257" r="10"/><circle cx="879" cy="299" r="8"/></g>
      <g fill="#152C28" stroke="#8CE3C0" stroke-width="2"><circle cx="674" cy="239" r="6"/><circle cx="778" cy="344" r="6"/></g>
      <circle cx="782" cy="257" r="19" stroke="#B79AFF" stroke-opacity=".18" stroke-width="6"/>
      <text x="557" y="362" fill="#A597B8" font-size="16">EXPLORATION GRAPH</text>

      <rect x="403" y="387" width="139" height="34" rx="9" fill="#241A31" stroke="#8B6BA6"/>
      <path d="M424 397v14m7-14v14" stroke="#D6C8E9" stroke-width="3"/>
      <text x="447" y="412" fill="#E5DCF1" font-size="22">Pause</text>
      <rect x="554" y="387" width="155" height="34" rx="9" fill="url(#op-lilac)"/>
      <path d="m573 396 0 16 12-8Z" fill="#241737"/>
      <text x="597" y="412" fill="#241737" font-size="22" font-weight="600">Resume</text>
    </g>

    <g transform="rotate(-5 218 408)" filter="url(#op-shadow)">
      <rect x="55" y="325" width="326" height="164" rx="15" fill="#141B25" stroke="#6B9C94" stroke-opacity=".7"/>
      <rect x="56" y="326" width="324" height="43" rx="14" fill="#19232D"/>
      <path d="M56 368h324" stroke="#3B565B"/>
      <rect x="76" y="339" width="18" height="16" rx="3" stroke="#8CE3C0" stroke-width="1.5"/>
      <path d="M81 344h8m-8 5h5" stroke="#8CE3C0" stroke-width="1.5"/>
      <text x="108" y="355" fill="#D7F4E9" font-size="22" font-weight="600">Traffic</text>
      <text x="77" y="400" fill="#A0C4BA" font-size="22">request</text>
      <path d="M169 394h39m-7-6 7 6-7 6" stroke="#8CE3C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="221" y="400" fill="#A0C4BA" font-size="22">response</text>
      <path d="M78 428h180m-180 12h113" stroke="#36534E" stroke-width="4" stroke-linecap="round"/>
      <path d="m78 465 33-1 17-11 20 10 25-19 29 16 20-7 28 9 22-19 27 15 29-5 30 9" stroke="#8CE3C0" stroke-opacity=".75" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="272" cy="443" r="4" fill="#8CE3C0"/>
    </g>

    <g transform="rotate(3 882 400)" filter="url(#op-shadow)">
      <rect x="705" y="300" width="359" height="205" rx="17" fill="url(#op-card)" stroke="#B39AC8" stroke-opacity=".8"/>
      <path d="M706 355h357" stroke="#70506E" stroke-opacity=".65"/>
      <rect x="725" y="317" width="25" height="25" rx="7" fill="#493524"/>
      <path d="M737.5 322v9m0 4v1" stroke="#F4C47E" stroke-width="2.5" stroke-linecap="round"/>
      <text x="763" y="339" fill="#F5ECFB" font-size="24" font-weight="600">Approvals</text>
      <circle cx="980" cy="328" r="4" fill="#F4C47E"/>
      <text x="727" y="385" fill="#C1AECF" font-size="22">Worker / chat request</text>
      <text x="727" y="420" fill="#F4C47E" font-size="22">Rule decision: ask</text>
      <rect x="726" y="443" width="148" height="41" rx="10" fill="#A7E7CA"/>
      <text x="800" y="471" text-anchor="middle" fill="#132A23" font-size="22" font-weight="600">Allow</text>
      <rect x="886" y="443" width="156" height="41" rx="10" fill="#241A2D" stroke="#876B98"/>
      <text x="964" y="471" text-anchor="middle" fill="#E0D2ED" font-size="22">Deny</text>
    </g>

    <circle cx="52" cy="542" r="4" fill="#F4C47E"/>
    <text x="69" y="549" fill="#D7C9E6" font-size="22">Review pending requests when rules ask.</text>
    <text x="1070" y="548" text-anchor="end" fill="#94859F" font-size="16">Guard scope varies by role.</text>
  </g>
</svg>
